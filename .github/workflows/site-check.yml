name: Portfolio site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate internal links and page structure
        run: python scripts/check_site.py
      - name: Check interactive motion JavaScript syntax
        run: node --check portfolio-motion.js
